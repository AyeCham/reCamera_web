<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 24px;
      font-size: 1.4rem;
      font-weight: bold;
    }

    main {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    thead {
      background: #eee;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 0.95rem;
    }

    th {
      font-weight: bold;
      color: #555;
    }

    tbody tr:hover {
      background: #f9f9f9;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    📜 History
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
          <th>Details</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" class="empty">
            No history loaded
          </td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
