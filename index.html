<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f0f0f0;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .type-start { color: green; font-weight: bold; }
    .type-stop { color: red; font-weight: bold; }
    .type-detect { color: #333; }
  </style>
</head>
<body>

  <h1>📜 History</h1>

  <table>
    <thead>
      <tr>
        <th>Type</th>
        <th>Time</th>
        <th>Counts</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr>
        <td colspan="4">Loading…</td>
      </tr>
    </tbody>
  </table>

  <script>
    const HISTORY_URL =
      "https://zhimfkxspjcsvdgkxlid.supabase.co/storage/v1/object/public/history/history_log_2026-01-21.jsonl";

    async function loadHistory() {
      const tbody = document.getElementById("history-body");
      tbody.innerHTML = "";

      try {
        const res = await fetch(HISTORY_URL);
        const text = await res.text();

        const lines = text.trim().split("\n");

        for (const line of lines) {
          if (!line) continue;

          const entry = JSON.parse(line);

          const tr = document.createElement("tr");

          const typeClass = `type-${entry.type}`;

          tr.innerHTML = `
            <td class="${typeClass}">${entry.type}</td>
            <td>${new Date(entry.time).toLocaleString()}</td>
            <td>${formatCounts(entry.counts)}</td>
            <td>${entry.total ?? ""}</td>
          `;

          tbody.appendChild(tr);
        }
      } catch (err) {
        tbody.innerHTML =
          `<tr><td colspan="4">Failed to load history</td></tr>`;
        console.error(err);
      }
    }

    function formatCounts(counts) {
      if (!counts || Object.keys(counts).length === 0) return "";
      return Object.entries(counts)
        .map(([k, v]) => `${k}: ${v}`)
        .join(", ");
    }

    loadHistory();
  </script>

</body>
</html>
