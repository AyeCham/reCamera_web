<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Camera Control</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; }
        body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        .video-box { background: #000; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; margin: 20px 0; border: 2px solid #ddd; }
        img { width: 100%; height: 100%; object-fit: contain; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        .btn-snap { background: var(--primary); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { text-align: center; margin-bottom: 10px; font-weight: bold; }
        .success { color: #059669; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📷 Camera Monitor</h2>
        <div id="status">Connecting...</div>
        
        <div class="video-box">
            <img id="stream" alt="Waiting for feed...">
        </div>

        <div class="controls">
            <button id="snapBtn" class="btn btn-snap" onclick="takeSnapshot()" disabled>Capture & Save to Disk</button>
        </div>
    </div>

    <script>
        const streamImg = document.getElementById('stream');
        const snapBtn = document.getElementById('snapBtn');
        const statusEl = document.getElementById('status');
        let currentBase64 = null;

        // Establish WebSocket connection directly to the camera/Node-RED proxy
        const ws = new WebSocket(`ws://${window.location.hostname}:8090`);

        ws.onopen = () => {
            statusEl.innerText = "● Live Connection Active";
            statusEl.className = "success";
            snapBtn.disabled = false;
        };

        ws.onmessage = (event) => {
            try {
                // Adjust based on your camera's JSON structure
                const data = JSON.parse(event.data);
                const imageData = data.data?.image || data.image;
                if (imageData) {
                    currentBase64 = imageData;
                    streamImg.src = "data:image/jpeg;base64," + imageData;
                }
            } catch (e) {
                console.error("Frame error", e);
            }
        };

        ws.onclose = () => {
            statusEl.innerText = "○ Disconnected";
            statusEl.className = "error";
            snapBtn.disabled = true;
        };

        async function takeSnapshot() {
            if (!currentBase64) return;
            
            snapBtn.disabled = true;
            statusEl.innerText = "Saving...";

            try {
                const response = await fetch('/api/snapshot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: currentBase64, ts: Date.now() })
                });

                if (response.ok) {
                    statusEl.innerText = "✅ Snapshot Saved Successfully";
                    setTimeout(() => { statusEl.innerText = "● Live Connection Active"; }, 2000);
                }
            } catch (err) {
                statusEl.innerText = "❌ Save Failed";
                console.error(err);
            } finally {
                snapBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
