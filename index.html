<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conveyor History</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      font-size: 28px;
      font-weight: 600;
    }

    .controls {
      background: #f8f9fa;
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
      border: 1px solid #e0e0e0;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls label {
      font-weight: 500;
      color: #555;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls input[type="date"] {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .auto-refresh {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 13px;
    }

    .refresh-indicator {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .sessions {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .session {
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      overflow: hidden;
    }

    .session-header {
      background: #f5f5f5;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .session-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .session-duration {
      font-size: 13px;
      color: #666;
    }

    .session-content {
      padding: 20px;
      background: white;
    }

    .session-times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .time-box {
      padding: 12px 15px;
      border-radius: 5px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
    }

    .time-label {
      font-size: 11px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .time-value {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .counts-table {
      width: 100%;
      border-collapse: collapse;
    }

    .counts-table th {
      background: #f8f9fa;
      padding: 12px 15px;
      text-align: left;
      font-weight: 600;
      color: #555;
      font-size: 13px;
      border-bottom: 2px solid #e0e0e0;
    }

    .counts-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .counts-table tr:last-child td {
      border-bottom: none;
    }

    .counts-table tbody tr:hover {
      background: #f9f9f9;
    }

    .item-name {
      font-weight: 500;
      color: #333;
    }

    .item-count {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .total-row {
      background: #f5f5f5 !important;
    }

    .total-row td {
      border-top: 2px solid #e0e0e0;
      padding-top: 15px;
      font-weight: 600;
    }

    .empty {
      background: #fafafa;
      padding: 60px 20px;
      text-align: center;
      border-radius: 8px;
      color: #999;
      font-size: 16px;
      border: 1px solid #e0e0e0;
    }

    .empty::before {
      content: "📭";
      display: block;
      font-size: 48px;
      margin-bottom: 15px;
    }

    .no-counts {
      color: #999;
      font-style: italic;
      padding: 20px;
      text-align: center;
      font-size: 14px;
    }

    .debug-info {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 768px) {
      .session-times {
        grid-template-columns: 1fr;
      }

      .session-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conveyor History</h1>

    <div class="controls">
      <label>
        Select Date:
        <input type="date" id="datePicker" />
      </label>
      <div class="auto-refresh">
        <div class="refresh-indicator"></div>
        Auto-refresh every 60s
      </div>
    </div>

    <div id="sessions" class="sessions"></div>

    <div id="empty" class="empty" style="display:none;">
      No sessions found for this date
    </div>
  </div>

<script>
const SUPABASE_BASE = "https://zhimfkxspjcsvdgkxlid.supabase.co/storage/v1/object/public/history";

const sessionsDiv = document.getElementById("sessions");
const emptyDiv = document.getElementById("empty");
const datePicker = document.getElementById("datePicker");

let refreshInterval;

// Set today as default
const today = new Date().toISOString().split("T")[0];
datePicker.value = today;
loadDate(today);

// Start auto-refresh
startAutoRefresh();

datePicker.addEventListener("change", e => {
  loadDate(e.target.value);
});

function startAutoRefresh() {
  refreshInterval = setInterval(() => {
    loadDate(datePicker.value);
  }, 60000); // 60 seconds
}

async function loadDate(date) {
  sessionsDiv.innerHTML = "";
  emptyDiv.style.display = "none";

  const url = `${SUPABASE_BASE}/linecross_log_${date}.jsonl`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Not found");

    const text = await res.text();
    const lines = text.trim().split("\n").filter(l => l);

    if (lines.length === 0) throw new Error("Empty");

    console.log(`Loaded ${lines.length} events`);
    const events = lines.map(line => JSON.parse(line));
    console.log("Events:", events);

    const sessions = parseSessions(events);
    console.log("Parsed sessions:", sessions);

    if (sessions.length === 0) {
      emptyDiv.style.display = "block";
      return;
    }

    sessions.forEach(session => renderSession(session));

  } catch (err) {
    console.error("Load error:", err);
    emptyDiv.style.display = "block";
  }
}

function parseSessions(events) {
  const sessions = [];
  let currentSession = null;

  for (let i = 0; i < events.length; i++) {
    const event = events[i];
    console.log(`[${i}] Processing:`, event);

    if (event.type === "session_start") {
      // Start new session
      currentSession = {
        startTime: event.time,
        stopTime: null,
        counts: {},
        validSequences: 0,
        invalidSequences: 0
      };
      console.log("Started new session at", event.time);
    } 
    else if (event.type === "session_stop") {
      if (currentSession) {
        currentSession.stopTime = event.time;
        console.log("Stopped session at", event.time, "- Total counts:", currentSession.counts);
        sessions.push(currentSession);
        currentSession = null;
      }
    }
    else if (event.type === "zone_in" && currentSession) {
      // Check if next 2 events form valid sequence: IN → OUT → downward_pass
      const nextEvent1 = events[i + 1];
      const nextEvent2 = events[i + 2];

      console.log(`  Checking sequence for ${event.item}:`);
      console.log(`    [${i}] zone_in: ${event.item}`);
      console.log(`    [${i+1}] next:`, nextEvent1);
      console.log(`    [${i+2}] next+2:`, nextEvent2);

      if (nextEvent1 && nextEvent2) {
        const isValidSequence = 
          nextEvent1.type === "zone_out" &&
          nextEvent1.item === event.item &&
          nextEvent2.type === "counted_pass" &&
          nextEvent2.item === event.item &&
          nextEvent2.direction === "downward_pass";

        if (isValidSequence) {
          // Valid sequence! Count it
          const item = event.item;
          currentSession.counts[item] = (currentSession.counts[item] || 0) + 1;
          currentSession.validSequences++;
          console.log(`  ✅ VALID sequence for ${item} - counted! Now at ${currentSession.counts[item]}`);
        } else {
          currentSession.invalidSequences++;
          console.log(`  ❌ INVALID sequence for ${event.item}`);
          console.log(`    Reason: ${
            nextEvent1?.type !== "zone_out" ? "next is not zone_out" :
            nextEvent1?.item !== event.item ? "item mismatch at zone_out" :
            nextEvent2?.type !== "counted_pass" ? "next+2 is not counted_pass" :
            nextEvent2?.item !== event.item ? "item mismatch at counted_pass" :
            nextEvent2?.direction !== "downward_pass" ? "not downward_pass" :
            "unknown"
          }`);
        }
      } else {
        console.log(`  ⚠️ Incomplete sequence for ${event.item} (missing next events)`);
      }
    }
  }

  // If there's an active session without stop, include it
  if (currentSession) {
    currentSession.stopTime = null; // Still running
    console.log("Active session (no stop yet):", currentSession);
    sessions.push(currentSession);
  }

  return sessions;
}

function renderSession(session) {
  const sessionDiv = document.createElement("div");
  sessionDiv.className = "session";

  const startTime = formatDateTime(session.startTime);
  const stopTime = session.stopTime ? formatDateTime(session.stopTime) : "Still running...";
  const duration = session.stopTime ? calculateDuration(session.startTime, session.stopTime) : "—";

  const totalCount = Object.values(session.counts).reduce((a, b) => a + b, 0);

  let countsHTML = "";
  if (Object.keys(session.counts).length > 0) {
    countsHTML = `
      <table class="counts-table">
        <thead>
          <tr>
            <th>Item Type</th>
            <th>Count</th>
          </tr>
        </thead>
        <tbody>
          ${Object.entries(session.counts)
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([item, count]) => `
              <tr>
                <td class="item-name">${item}</td>
                <td class="item-count">${count}</td>
              </tr>
            `).join("")}
          <tr class="total-row">
            <td>TOTAL</td>
            <td class="item-count">${totalCount}</td>
          </tr>
        </tbody>
      </table>
      <div class="debug-info">
        Valid sequences (IN→OUT→downward): ${session.validSequences || 0} | 
        Invalid sequences: ${session.invalidSequences || 0}
      </div>
    `;
  } else {
    countsHTML = `
      <div class="no-counts">No valid IN→OUT→downward_pass sequences in this session</div>
      <div class="debug-info">
        Valid sequences: ${session.validSequences || 0} | 
        Invalid sequences: ${session.invalidSequences || 0}
      </div>
    `;
  }

  sessionDiv.innerHTML = `
    <div class="session-header">
      <div class="session-title">
        Session ${session.stopTime ? '(Completed)' : '(Active)'}
      </div>
      <div class="session-duration">
        Duration: ${duration}
      </div>
    </div>
    <div class="session-content">
      <div class="session-times">
        <div class="time-box">
          <div class="time-label">Start</div>
          <div class="time-value">${startTime}</div>
        </div>
        <div class="time-box">
          <div class="time-label">${session.stopTime ? 'Stop' : 'Running'}</div>
          <div class="time-value">${stopTime}</div>
        </div>
      </div>
      ${countsHTML}
    </div>
  `;

  sessionsDiv.appendChild(sessionDiv);
}

function formatDateTime(isoString) {
  if (!isoString) return "—";
  const date = new Date(isoString);
  return date.toLocaleString('en-US', {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
}

function calculateDuration(start, stop) {
  const ms = new Date(stop) - new Date(start);
  const seconds = Math.floor(ms / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);

  if (hours > 0) {
    return `${hours}h ${minutes % 60}m`;
  } else if (minutes > 0) {
    return `${minutes}m ${seconds % 60}s`;
  } else {
    return `${seconds}s`;
  }
}
</script>

</body>
</html>
