<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .controls {
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #efefef;
    }
    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
    }
    .new-row {
      animation: highlight 1s ease-in-out;
    }
    @keyframes highlight {
      0% { background-color: #ffffcc; }
      100% { background-color: white; }
    }
  </style>
</head>
<body>

  <h1>📜 History</h1>

  <div class="controls">
    <label>
      Select date:
      <input type="date" id="datePicker" />
    </label>
  </div>

  <table id="historyTable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Counts</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="empty" class="empty" style="display:none;">
    No data for this day
  </div>

<script>
const SUPABASE_BASE =
  "https://zhimfkxspjcsvdgkxlid.supabase.co/storage/v1/object/public/history";

const tableBody = document.querySelector("#historyTable tbody");
const emptyDiv = document.getElementById("empty");
const datePicker = document.getElementById("datePicker");

let currentData = [];
let refreshInterval;

// Set today as default
const today = new Date().toISOString().split("T")[0];
datePicker.value = today;
loadDate(today);

// Start polling for updates
startPolling();

datePicker.addEventListener("change", e => {
  currentData = [];
  loadDate(e.target.value);
});

function startPolling() {
  // Check for updates every 5 seconds (less noticeable than 60s)
  refreshInterval = setInterval(() => {
    checkForUpdates(datePicker.value);
  }, 5000);
}

async function loadDate(date) {
  tableBody.innerHTML = "";
  emptyDiv.style.display = "none";

  const url = `${SUPABASE_BASE}/history_log_${date}.jsonl`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Not found");

    const text = await res.text();
    const lines = text.trim().split("\n").filter(line => line);

    if (lines.length === 0) throw new Error("Empty");

    currentData = lines.map(line => JSON.parse(line));
    
    for (const row of currentData) {
      addRow(row, false);
    }
  } catch (err) {
    emptyDiv.style.display = "block";
    currentData = [];
  }
}

async function checkForUpdates(date) {
  const url = `${SUPABASE_BASE}/history_log_${date}.jsonl`;

  try {
    const res = await fetch(url, { 
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache' }
    });
    if (!res.ok) return;

    const text = await res.text();
    const lines = text.trim().split("\n").filter(line => line);
    const newData = lines.map(line => JSON.parse(line));

    // Check if there are new entries
    if (newData.length > currentData.length) {
      // Only add the new entries
      const newEntries = newData.slice(currentData.length);
      for (const entry of newEntries) {
        addRow(entry, true);
      }
      currentData = newData;
    } else if (newData.length < currentData.length) {
      // Data was cleared or modified, reload completely
      currentData = [];
      loadDate(date);
    }
  } catch (err) {
    // Silently fail, will try again in next poll
  }
}

function addRow(entry, isNew = false) {
  const tr = document.createElement("tr");
  if (isNew) {
    tr.className = "new-row";
  }

  const time = entry.time
    ? new Date(entry.time).toLocaleTimeString()
    : "";

  tr.innerHTML = `
    <td>${time}</td>
    <td>${entry.type || ""}</td>
    <td>${entry.counts ? JSON.stringify(entry.counts) : ""}</td>
    <td>${entry.total ?? ""}</td>
  `;

  tableBody.appendChild(tr);
}
</script>

</body>
</html>
