<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .controls {
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #efefef;
    }
    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
    }
    .refresh-indicator {
      display: inline-block;
      margin-left: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>📜 History <span class="refresh-indicator" id="refreshIndicator"></span></h1>

  <div class="controls">
    <label>
      Select date:
      <input type="date" id="datePicker" />
    </label>
  </div>

  <table id="historyTable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Counts</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="empty" class="empty" style="display:none;">
    No data for this day
  </div>

<script>
const SUPABASE_BASE =
  "https://zhimfkxspjcsvdgkxlid.supabase.co/storage/v1/object/public/history";

const tableBody = document.querySelector("#historyTable tbody");
const emptyDiv = document.getElementById("empty");
const datePicker = document.getElementById("datePicker");
const refreshIndicator = document.getElementById("refreshIndicator");

let refreshInterval;
let countdown = 60;

// Set today as default
const today = new Date().toISOString().split("T")[0];
datePicker.value = today;
loadDate(today);

// Start auto-refresh
startAutoRefresh();

datePicker.addEventListener("change", e => {
  loadDate(e.target.value);
  // Reset the countdown when user manually changes date
  countdown = 60;
});

function startAutoRefresh() {
  // Update countdown every second
  setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      countdown = 60;
    }
    refreshIndicator.textContent = `(refreshing in ${countdown}s)`;
  }, 1000);

  // Refresh data every 60 seconds
  refreshInterval = setInterval(() => {
    loadDate(datePicker.value);
  }, 60000);
}

async function loadDate(date) {
  tableBody.innerHTML = "";
  emptyDiv.style.display = "none";

  const url = `${SUPABASE_BASE}/history_log_${date}.jsonl`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Not found");

    const text = await res.text();
    const lines = text.trim().split("\n");

    if (lines.length === 0) throw new Error("Empty");

    for (const line of lines) {
      const row = JSON.parse(line);
      addRow(row);
    }
  } catch (err) {
    emptyDiv.style.display = "block";
  }
}

function addRow(entry) {
  const tr = document.createElement("tr");

  const time = entry.time
    ? new Date(entry.time).toLocaleTimeString()
    : "";

  tr.innerHTML = `
    <td>${time}</td>
    <td>${entry.type || ""}</td>
    <td>${entry.counts ? JSON.stringify(entry.counts) : ""}</td>
    <td>${entry.total ?? ""}</td>
  `;

  tableBody.appendChild(tr);
}
</script>

</body>
</html>
